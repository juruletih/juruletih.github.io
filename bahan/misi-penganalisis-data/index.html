<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misi Penganalisis Data — Matematik T1 Bab 12</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#d9deea;
  --pri:#2f5bea; --pri-ink:#ffffff; --ok:#1e8e4e; --ok-bg:#e6f6ec; --bad:#c0392b; --bad-bg:#fdecea;
  --warn-bg:#fff6dc; --note-bg:#eef3ff; --chip:#e9edf7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5}
#app{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:40px}
.top .sp{flex:1}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;cursor:pointer;background:var(--pri);color:var(--pri-ink);text-align:center}
.btn.block{display:block;width:100%;margin-top:12px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:15px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(20,30,60,.08)}
h1{font-size:24px;margin:6px 0 4px}
h2{font-size:20px;margin:4px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
.muted{color:var(--muted);font-size:15px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;margin-right:4px}
.lvl-Rendah{background:#e3f2fd}.lvl-Sederhana{background:#e8f5e9}.lvl-Tinggi{background:#fff3e0}.lvl-KBAT{background:#f3e5f5}
.ver{display:inline-block;background:#fff1a8;border:1px solid #e6cf4f;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;margin-top:10px}
.databox{background:var(--note-bg);border-radius:10px;padding:10px 12px;margin:8px 0;word-wrap:break-word}
.note{background:var(--note-bg);border-left:4px solid var(--pri);border-radius:8px;padding:10px 12px;margin:8px 0}
.warn{background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:16px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--pri);background:#eef2ff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0}
.fb.ok{background:var(--ok-bg);border:1px solid #b9e3c8}
.fb.bad{background:var(--bad-bg);border:1px solid #f3c1bb}
.fb.hint{background:var(--warn-bg);border:1px solid #f0dc94}
input[type=text]{width:100%;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:12px;margin:6px 0}
input[type=text]:focus{outline:none;border-color:var(--pri)}
.bar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin:6px 0}
.bar > div{height:100%;background:var(--pri)}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
table.t th{background:var(--chip)}
.tally{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.tally svg{display:block;width:36px;height:26px;flex:0 0 36px}
.chart{display:block;width:100%;max-width:520px;margin:8px auto;background:#fff;border-radius:10px}
.mods{display:grid;grid-template-columns:1fr;gap:10px}
.mod{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);font-size:16px}
.mod .t1{font-weight:700}
.mod.done{border-color:var(--ok)}
.big{font-size:28px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--note-bg);border-radius:12px;padding:10px;text-align:center}
.log{max-height:none}
.log .row{border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.stem{font-family:ui-monospace,Menlo,Consolas,monospace}
ol,ul{padding-left:22px;margin:6px 0}
li{margin:3px 0}
@media (min-width:600px){.mods{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var VERSION = "Bab12-v1";
var KEY = "misi_bab12_t1_hub";

/* ================= PEMBANTU VISUAL (self-contained) ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function tally(n){
  var out = '<div class="tally" aria-label="gundalan '+n+'">';
  var full = Math.floor(n/5), rem = n%5, i, k;
  for(i=0;i<full;i++){
    out += '<svg viewBox="0 0 36 26">';
    for(k=0;k<4;k++){ out += '<line x1="'+(6+k*7)+'" y1="3" x2="'+(6+k*7)+'" y2="23" stroke="#1d2433" stroke-width="2"/>'; }
    out += '<line x1="2" y1="20" x2="34" y2="6" stroke="#c0392b" stroke-width="2"/></svg>';
  }
  if(rem>0){
    out += '<svg viewBox="0 0 36 26">';
    for(k=0;k<rem;k++){ out += '<line x1="'+(6+k*7)+'" y1="3" x2="'+(6+k*7)+'" y2="23" stroke="#1d2433" stroke-width="2"/>'; }
    out += '</svg>';
  }
  return out + '</div>';
}

function table(head, rows){
  var h = '<table class="t"><tr>' + head.map(function(x){return '<th>'+x+'</th>';}).join('') + '</tr>';
  rows.forEach(function(r){ h += '<tr>' + r.map(function(x){return '<td>'+x+'</td>';}).join('') + '</tr>'; });
  return h + '</table>';
}

function barChart(labels, values, opt){
  opt = opt || {};
  var W=360,H=230,L=40,B=40,T=24,R=10;
  var max = opt.max || Math.max.apply(null, values);
  var step = opt.step || Math.max(1, Math.ceil(max/5));
  max = Math.ceil(max/step)*step;
  var pw=W-L-R, ph=H-T-B, n=labels.length, bw=pw/n*0.6;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  if(opt.title) s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-size="13" font-weight="700">'+esc(opt.title)+'</text>';
  for(var v=0; v<=max; v+=step){
    var y=T+ph-(v/max)*ph;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e3e7f0"/>';
    s+='<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11">'+v+'</text>';
  }
  for(var i=0;i<n;i++){
    var x=L+pw/n*i+(pw/n-bw)/2, h=(values[i]/max)*ph;
    s+='<rect x="'+x+'" y="'+(T+ph-h)+'" width="'+bw+'" height="'+h+'" fill="#2f5bea"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="11">'+esc(labels[i])+'</text>';
  }
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="#1d2433"/>';
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#1d2433"/>';
  if(opt.ylab) s+='<text x="12" y="'+(T+ph/2)+'" font-size="11" transform="rotate(-90 12 '+(T+ph/2)+')" text-anchor="middle">'+esc(opt.ylab)+'</text>';
  if(opt.xlab) s+='<text x="'+(L+pw/2)+'" y="'+(H-6)+'" font-size="11" text-anchor="middle">'+esc(opt.xlab)+'</text>';
  return s+'</svg>';
}

/* Carta palang dengan paksi tegak bermula pada nilai bukan sifar (untuk 12.1.6) */
function bar2(labels, values, ymin, ymax, step, title){
  var W=360,H=220,L=44,B=34,T=24,R=10,pw=W-L-R,ph=H-T-B,n=labels.length,bw=pw/n*0.5;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-size="13" font-weight="700">'+esc(title)+'</text>';
  for(var v=ymin; v<=ymax; v+=step){
    var y=T+ph-((v-ymin)/(ymax-ymin))*ph;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e3e7f0"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11">'+v+'</text>';
  }
  for(var i=0;i<n;i++){
    var x=L+pw/n*i+(pw/n-bw)/2, h=((values[i]-ymin)/(ymax-ymin))*ph;
    s+='<rect x="'+x+'" y="'+(T+ph-h)+'" width="'+bw+'" height="'+h+'" fill="'+(i?'#c0392b':'#2f5bea')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="11">'+esc(labels[i])+'</text>';
  }
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="#1d2433"/><line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#1d2433"/>';
  return s+'</svg>';
}

function pieChart(labels, values, opt){
  opt = opt || {};
  var cols=["#2f5bea","#f39c12","#1e8e4e","#c0392b","#8e44ad","#16a085"];
  var tot=values.reduce(function(a,b){return a+b;},0), cx=110, cy=110, r=90, a0=-Math.PI/2;
  var s='<svg class="chart" viewBox="0 0 360 230" role="img">';
  values.forEach(function(v,i){
    var a1=a0+v/tot*2*Math.PI, large=(a1-a0)>Math.PI?1:0;
    var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    s+='<path d="M'+cx+','+cy+' L'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+cols[i%6]+'" stroke="#fff" stroke-width="2"/>';
    var am=(a0+a1)/2;
    if(opt.showAngle) s+='<text x="'+(cx+r*0.6*Math.cos(am)).toFixed(1)+'" y="'+(cy+r*0.6*Math.sin(am)+4).toFixed(1)+'" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">'+Math.round(v/tot*360)+'°</text>';
    a0=a1;
  });
  labels.forEach(function(l,i){
    s+='<rect x="230" y="'+(40+i*24)+'" width="14" height="14" fill="'+cols[i%6]+'"/><text x="250" y="'+(52+i*24)+'" font-size="13">'+esc(l)+'</text>';
  });
  return s+'</svg>';
}

function lineGraph(labels, values, opt){
  opt = opt || {};
  var W=360,H=220,L=40,B=36,T=24,R=16,pw=W-L-R,ph=H-T-B,n=labels.length;
  var max=opt.max||Math.max.apply(null,values), step=opt.step||Math.max(1,Math.ceil(max/5)); max=Math.ceil(max/step)*step;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  if(opt.title) s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-size="13" font-weight="700">'+esc(opt.title)+'</text>';
  for(var v=0; v<=max; v+=step){ var y=T+ph-(v/max)*ph; s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e3e7f0"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11">'+v+'</text>'; }
  var pts=[];
  for(var i=0;i<n;i++){ var x=L+pw*(i+0.5)/n, y2=T+ph-(values[i]/max)*ph; pts.push(x.toFixed(1)+','+y2.toFixed(1));
    s+='<text x="'+x+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="11">'+esc(labels[i])+'</text>'; }
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#2f5bea" stroke-width="2.5"/>';
  pts.forEach(function(p){ var q=p.split(','); s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="#2f5bea"/>'; });
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="#1d2433"/><line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#1d2433"/>';
  if(opt.xlab) s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle">'+esc(opt.xlab)+'</text>';
  return s+'</svg>';
}

/* counts: objek {nilai: bilangan} untuk nilai lo..hi */
function dotPlot(lo, hi, counts, xlab){
  var n=hi-lo+1, W=360, H=200, L=20, R=20, base=160, pw=W-L-R;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  s+='<line x1="'+L+'" y1="'+base+'" x2="'+(W-R)+'" y2="'+base+'" stroke="#1d2433"/>';
  for(var v=lo; v<=hi; v++){
    var x=L+pw*((v-lo)+0.5)/n;
    s+='<line x1="'+x+'" y1="'+base+'" x2="'+x+'" y2="'+(base+5)+'" stroke="#1d2433"/><text x="'+x+'" y="'+(base+20)+'" text-anchor="middle" font-size="12">'+v+'</text>';
    for(var k=0;k<(counts[v]||0);k++){ s+='<circle cx="'+x+'" cy="'+(base-12-k*18)+'" r="6" fill="#2f5bea"/>'; }
  }
  if(xlab) s+='<text x="'+(W/2)+'" y="'+(H-2)+'" text-anchor="middle" font-size="11">'+esc(xlab)+'</text>';
  return s+'</svg>';
}

function stemLeaf(rows, key){
  var h='<table class="t stem"><tr><th>Batang</th><th>Daun</th></tr>';
  rows.forEach(function(r){ h+='<tr><td>'+r[0]+'</td><td style="text-align:left">'+r[1].join(' ')+'</td></tr>'; });
  return h+'</table><div class="muted">Kekunci: '+key+'</div>';
}

/* Histogram: kelas berturutan, palang bersentuhan */
function histogram(classes, freq, opt){
  opt=opt||{};
  var W=360,H=230,L=40,B=40,T=24,R=10,pw=W-L-R,ph=H-T-B,n=classes.length;
  var max=opt.max||Math.max.apply(null,freq), step=opt.step||2; max=Math.ceil(max/step)*step;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  if(opt.title) s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-size="13" font-weight="700">'+esc(opt.title)+'</text>';
  for(var v=0; v<=max; v+=step){ var y=T+ph-(v/max)*ph; s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e3e7f0"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11">'+v+'</text>'; }
  var bw=pw/n, pts=[];
  for(var i=0;i<n;i++){
    var x=L+bw*i, h=(freq[i]/max)*ph;
    s+='<rect x="'+x+'" y="'+(T+ph-h)+'" width="'+bw+'" height="'+h+'" fill="#9fb4f5" stroke="#2f5bea"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="10">'+esc(classes[i])+'</text>';
    pts.push((x+bw/2).toFixed(1)+','+(T+ph-h).toFixed(1));
  }
  if(opt.polygon){ s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#c0392b" stroke-width="2.5"/>'; pts.forEach(function(p){var q=p.split(',');s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="#c0392b"/>';}); }
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="#1d2433"/><line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#1d2433"/>';
  if(opt.xlab) s+='<text x="'+(L+pw/2)+'" y="'+(H-6)+'" font-size="11" text-anchor="middle">'+esc(opt.xlab)+'</text>';
  return s+'</svg>';
}

/* ================= KANDUNGAN MODUL (rujukan: DSKP KSSM Matematik T1, hlm 78-80) ================= */

/* ================= STATE ================= */
function freshState(){
  return { v:VERSION, name:"", kelas:"", startAt:0, endAt:0, path:["welcome"], cur:null, mods:{}, log:[] };
}
function freshMod(m){
  var q=[]; for(var i=0;i<m.bank.length;i++) q.push(i);
  return { phase:"intro", di:0, wi:0, queue:q, seen:{}, firstOk:{}, ei:0, exitScore:0, done:false };
}
var state = freshState();
function loadState(){
  try{
    var saved = localStorage.getItem(KEY);
    if(saved){ state = Object.assign(freshState(), JSON.parse(saved)); }
  }catch(e){ state = freshState(); }
  MODS.forEach(function(m){ state.mods[m.id] = Object.assign(freshMod(m), state.mods[m.id] || {}); });
  if(!state.path || !state.path.length) state.path=["welcome"];
}
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* UI sementara (tidak disimpan) */
var ui = { sel:null, input:"", checked:false, ok:null, tries:0, showHint:false };
function resetUi(){ ui = { sel:null, input:"", checked:false, ok:null, tries:0, showHint:false }; }

/* ================= NAVIGASI (stack dalaman, tiada History API) ================= */
function screen(){ return state.path[state.path.length-1]; }
function goTo(s){ state.path.push(s); resetUi(); saveState(); render(); }
function goBack(){
  if(screen()==="mod"){ var m=state.mods[state.cur]; if(m && !m.done && m.phase!=="intro"){ /* keluar modul, kemajuan disimpan */ } }
  if(state.path.length>1){ state.path.pop(); }
  resetUi(); saveState(); render();
}
function goHome(){ state.path = state.name ? ["menu"] : ["welcome"]; resetUi(); saveState(); render(); }

/* ================= LOG JAWAPAN ================= */
function plain(html){ var d=document.createElement("div"); d.innerHTML=html.replace(/<svg[\s\S]*?<\/svg>/g," [rajah] ").replace(/<table[\s\S]*?<\/table>/g," [jadual] "); return (d.textContent||"").replace(/\s+/g," ").trim().slice(0,140); }
function logAnswer(mod, phase, q, given, ok){
  var correct = q.type==="mcq" ? q.opts[q.ans] : (q.ans + (q.unit?(" "+q.unit):""));
  state.log.push({ m:mod.sp, p:phase, lvl:q.lvl||"", q:plain(q.q), a:String(given), c:String(correct), ok:ok });
}

/* ================= SEMAK JAWAPAN ================= */
function isRight(q){
  if(q.type==="mcq") return ui.sel===q.ans;
  var v = parseFloat(String(ui.input).replace(",",".").replace(/[^0-9.\-]/g,""));
  return !isNaN(v) && Math.abs(v - q.ans) < 0.01;
}
function givenText(q){ return q.type==="mcq" ? (ui.sel===null?"-":q.opts[ui.sel]) : (ui.input||"-"); }
function canCheck(q){ return q.type==="mcq" ? ui.sel!==null : String(ui.input).trim()!==""; }

/* ================= RENDER ================= */
var app = document.getElementById("app");
function topBar(title){
  var back = state.path.length>1 ? '<button class="btn ghost small" onclick="goBack()">← Kembali</button>' : '';
  var home = (screen()!=="menu" && state.name) ? '<button class="btn ghost small" onclick="goHome()">☰ Menu</button>' : '';
  return '<div class="top">'+back+'<div class="sp"><b>'+(title||"")+'</b></div>'+home+'</div>';
}
function render(){
  var s = screen(), h = "";
  if(s==="welcome") h = scrWelcome();
  else if(s==="form") h = scrForm();
  else if(s==="menu") h = scrMenu();
  else if(s==="mod") h = scrMod();
  else if(s==="summary") h = scrSummary();
  else if(s==="reset") h = scrReset();
  else h = scrWelcome();
  app.innerHTML = h;
  window.scrollTo(0,0);
  var inp = document.getElementById("numin"); if(inp){ inp.value = ui.input; }
}

function scrWelcome(){
  return '<div class="card" style="text-align:center"><div class="big">📊</div><h1>Misi Penganalisis Data</h1>'+
    '<div class="muted">Matematik Tingkatan 1 · Bab 12 Pengendalian Data</div>'+
    '<p>6 misi mengikut Standard Pembelajaran 12.1.1 hingga 12.1.6. Setiap misi ada semakan awal, nota lengkap, latihan 4 aras dan tiket keluar.</p>'+
    '<button class="btn block" onclick="startApp()">Mula Misi →</button>'+
    (state.name ? '<button class="btn ghost block" onclick="goTo(\'reset\')">Reset semua kemajuan</button>' : '')+
    '<div class="ver">🔖 VERSI: '+VERSION+'</div></div>';
}
function startApp(){ if(state.name){ state.path=["menu"]; resetUi(); saveState(); render(); } else { goTo("form"); } }

function scrForm(){
  return topBar("Daftar Masuk")+'<div class="card"><h2>Siapa anda?</h2>'+
    '<label>Nama</label><input type="text" id="fname" autocomplete="off" placeholder="cth. Nur Aisyah">'+
    '<label>Kelas</label><input type="text" id="fkelas" autocomplete="off" placeholder="cth. 1 Amanah">'+
    '<div id="ferr" class="muted"></div>'+
    '<button class="btn block" onclick="submitForm()">Sedia, Mula!</button>'+
    '<div class="muted" style="margin-top:8px">Pemasa bermula selepas anda tekan butang ini.</div></div>';
}
function submitForm(){
  var n=document.getElementById("fname").value.trim(), k=document.getElementById("fkelas").value.trim();
  if(!n || !k){ document.getElementById("ferr").innerHTML='<span class="bad-t">Sila isi nama dan kelas.</span>'; return; }
  state.name=n; state.kelas=k; state.startAt=Date.now(); state.endAt=0;
  state.path=["menu"]; resetUi(); saveState(); render();
}

function modScore(id){
  var m=MODS.filter(function(x){return x.id===id;})[0], st=state.mods[id], b=0;
  for(var k in st.firstOk){ if(st.firstOk[k]) b++; }
  return { bank:b, bankMax:m.bank.length, exit:st.exitScore, exitMax:m.exit.length };
}
function totals(){
  var t=0,mx=0,done=0;
  MODS.forEach(function(m){ var s=modScore(m.id); t+=s.bank+s.exit; mx+=s.bankMax+s.exitMax; if(state.mods[m.id].done) done++; });
  return {t:t,mx:mx,done:done};
}
function fmtTime(ms){ var s=Math.max(0,Math.round(ms/1000)), m=Math.floor(s/60); return m+" min "+(s%60)+" saat"; }

function scrMenu(){
  var tt=totals();
  var h='<div class="top"><div class="sp"><b>Menu Bab 12</b><div class="muted">'+esc(state.name)+' · '+esc(state.kelas)+'</div></div><button class="btn ghost small" onclick="goTo(\'welcome\')">⚙︎</button></div>';
  h+='<div class="card"><div>Kemajuan: <b>'+tt.done+' / '+MODS.length+'</b> misi selesai</div><div class="bar"><div style="width:'+(tt.done/MODS.length*100)+'%"></div></div></div>';
  h+='<div class="mods">';
  MODS.forEach(function(m){
    var st=state.mods[m.id], s=modScore(m.id);
    var status = st.done ? '<span class="ok-t">✔ Selesai · '+(s.bank+s.exit)+'/'+(s.bankMax+s.exitMax)+'</span>' : (st.phase!=="intro" ? '<span class="muted">Sedang berjalan…</span>' : '<span class="muted">Belum mula</span>');
    h+='<button class="mod'+(st.done?' done':'')+'" onclick="openMod(\''+m.id+'\')"><div class="t1">'+m.icon+' '+m.sp+' · '+m.title+'</div><div>'+status+'</div></button>';
  });
  h+='</div><button class="btn block" onclick="openSummary()">📋 Ringkasan Bab'+(tt.done===MODS.length?'':' (belum lengkap)')+'</button>';
  return h;
}
function openMod(id){ state.cur=id; goTo("mod"); }
function openSummary(){
  if(totals().done===MODS.length && !state.endAt){ state.endAt=Date.now(); }
  goTo("summary");
}

/* ---------- Skrin modul ---------- */
function curMod(){ return MODS.filter(function(x){return x.id===state.cur;})[0]; }
function phaseLabel(p){ return {intro:"Misi",diag:"Semakan Awal",note:"Nota Lengkap",wedo:"Latihan Berpandu",bank:"Latihan 4 Aras",exit:"Tiket Keluar",done:"Selesai"}[p]; }
function scrMod(){
  var m=curMod(), st=state.mods[m.id];
  var order=["intro","diag","note","wedo","bank","exit","done"], pi=order.indexOf(st.phase);
  var h=topBar(m.icon+" "+m.sp)+'<div class="muted">'+phaseLabel(st.phase)+'</div><div class="bar"><div style="width:'+(pi/(order.length-1)*100)+'%"></div></div>';
  if(st.phase==="intro"){
    h+='<div class="card"><h2>'+m.title+'</h2><div class="note"><b>Objektif:</b> '+m.objective+'</div>'+
       '<ol><li>Semakan awal (2 soalan)</li><li>Baca nota lengkap</li><li>Latihan berpandu</li><li>Latihan 4 aras: Rendah, Sederhana, Tinggi, KBAT</li><li>Tiket keluar</li></ol>'+
       '<div class="muted">Soalan yang salah akan diulang sehingga anda betul. Markah dikira daripada cubaan pertama.</div>'+
       '<button class="btn block" onclick="setPhase(\'diag\')">Mula →</button></div>';
  } else if(st.phase==="diag"){
    h+=qCard(m.diag[st.di], "Semakan Awal "+(st.di+1)+"/"+m.diag.length, "diag");
  } else if(st.phase==="note"){
    h+='<div class="card"><h2>📘 Nota Lengkap: '+m.title+'</h2>'+m.note+'<button class="btn block" onclick="setPhase(\'wedo\')">Faham, Sedia untuk Latihan →</button></div>';
  } else if(st.phase==="wedo"){
    h+=qCard(m.wedo[st.wi], "Latihan Berpandu", "wedo");
  } else if(st.phase==="bank"){
    var qi=st.queue[0], q=m.bank[qi], left=st.queue.length;
    h+=qCard(q, 'Baki '+left+' soalan', "bank");
  } else if(st.phase==="exit"){
    h+=qCard(m.exit[st.ei], "Tiket Keluar "+(st.ei+1)+"/"+m.exit.length, "exit");
  } else {
    var s=modScore(m.id);
    h+='<div class="card" style="text-align:center"><div class="big">🏅</div><h2>Misi '+m.sp+' selesai!</h2>'+
       '<div class="grid2"><div class="stat">Latihan 4 aras<br><b>'+s.bank+' / '+s.bankMax+'</b><div class="muted">betul cubaan pertama</div></div><div class="stat">Tiket keluar<br><b>'+s.exit+' / '+s.exitMax+'</b></div></div>'+
       '<button class="btn block" onclick="goHome()">Kembali ke Menu Bab</button></div>';
  }
  return h;
}
function setPhase(p){ var st=state.mods[state.cur]; st.phase=p; resetUi(); saveState(); render(); }

function qCard(q, label, phase){
  var h='<div class="card"><div>'+(q.lvl?'<span class="chip lvl-'+q.lvl+'">'+q.lvl+'</span>':'')+'<span class="muted">'+label+'</span></div>';
  h+='<div style="margin-top:8px">'+q.q+'</div>';
  if(q.type==="mcq"){
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(ui.checked && (ui.ok || ui.tries>=2 || phase==="diag" || phase==="exit")){ if(i===q.ans) cls+=" right"; else if(i===ui.sel) cls+=" wrong"; }
      else if(ui.checked && i===ui.sel && !ui.ok) cls+=" wrong";
      else if(i===ui.sel) cls+=" sel";
      h+='<button class="'+cls+'" '+(ui.checked?'disabled':'')+' onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>';
    });
  } else {
    h+='<input type="text" id="numin" inputmode="decimal" autocomplete="off" placeholder="Taip jawapan'+(q.unit?(" ("+q.unit+")"):"")+'" oninput="ui.input=this.value" '+(ui.checked?'disabled':'')+'>';
  }
  if(phase==="wedo" && !ui.checked && q.hint){
    h+= ui.showHint ? '<div class="fb hint">💡 '+q.hint+'</div>' : '<button class="btn ghost small" onclick="ui.showHint=true;render()">💡 Bantuan</button>';
  }
  if(!ui.checked){
    h+='<button class="btn block" onclick="check(\''+phase+'\')" '+(canCheck(q)?'':'')+'>Semak Jawapan</button>';
  } else {
    h+=feedback(q, phase);
  }
  return h+'</div>';
}
function pick(i){ if(ui.checked) return; ui.sel=i; render(); }

function feedback(q, phase){
  var h="";
  var correctTxt = q.type==="mcq" ? q.opts[q.ans] : (q.ans+(q.unit?(" "+q.unit):""));
  if(ui.ok){
    h+='<div class="fb ok">✅ <b>Betul!</b>'+(q.expl?' '+q.expl:'')+'</div>';
    h+='<button class="btn block" onclick="next(\''+phase+'\')">Teruskan →</button>';
    return h;
  }
  var mis = (q.type==="mcq" && q.fb && q.fb[ui.sel]) ? q.fb[ui.sel] : "";
  if(phase==="diag" || phase==="exit"){
    h+='<div class="fb bad">❌ Jawapan betul: <b>'+correctTxt+'</b>.'+(mis?'<br>'+mis:'')+(q.expl?'<br>'+q.expl:'')+'</div>';
    h+='<button class="btn block" onclick="next(\''+phase+'\')">Teruskan →</button>';
    return h;
  }
  if(ui.tries<2){
    h+='<div class="fb bad">❌ Belum tepat.'+(mis?'<br>'+mis:'')+'</div>';
    if(q.hint) h+='<div class="fb hint">💡 '+q.hint+'</div>';
    h+='<button class="btn block" onclick="retry()">Cuba Lagi</button>';
  } else {
    h+='<div class="fb bad">❌ Jawapan betul: <b>'+correctTxt+'</b>.'+(mis?'<br>'+mis:'')+(q.hint?'<br>💡 '+q.hint:'')+'</div>';
    h+='<div class="muted">'+(phase==="bank"?'Soalan ini akan diulang di hujung latihan.':'')+'</div>';
    h+='<button class="btn block" onclick="next(\''+phase+'\')">Teruskan →</button>';
  }
  return h;
}
function retry(){ ui.checked=false; ui.ok=null; ui.sel=null; ui.input=""; render(); }

function check(phase){
  var m=curMod(), st=state.mods[m.id], q;
  if(phase==="diag") q=m.diag[st.di];
  else if(phase==="wedo") q=m.wedo[st.wi];
  else if(phase==="bank") q=m.bank[st.queue[0]];
  else q=m.exit[st.ei];
  var inp=document.getElementById("numin"); if(inp) ui.input=inp.value;
  if(!canCheck(q)) return;
  ui.tries++; ui.ok=isRight(q); ui.checked=true;
  var phName={diag:"Semakan Awal",wedo:"Berpandu",bank:"Latihan",exit:"Tiket Keluar"}[phase];
  logAnswer(m, phName+(ui.tries>1?" (cubaan "+ui.tries+")":""), q, givenText(q), ui.ok);
  if(phase==="bank"){
    var qi=st.queue[0];
    if(!st.seen[qi]){ st.seen[qi]=true; st.firstOk[qi]=ui.ok; }
  }
  if(phase==="exit" && ui.ok){ st.exitScore++; }
  saveState(); render();
}

/* Pengendali klik "Teruskan": semua peralihan fasa di sini, bukan di fungsi paparan */
function next(phase){
  var m=curMod(), st=state.mods[m.id];
  if(phase==="diag"){
    st.di++; if(st.di>=m.diag.length){ st.phase="note"; }
  } else if(phase==="wedo"){
    if(!ui.ok){ /* selepas 2 cubaan salah, tetap teruskan */ }
    st.wi++; if(st.wi>=m.wedo.length){ st.phase="bank"; }
  } else if(phase==="bank"){
    var qi=st.queue.shift();
    if(!ui.ok){ st.queue.push(qi); }
    if(st.queue.length===0){ st.phase="exit"; }
  } else if(phase==="exit"){
    st.ei++; if(st.ei>=m.exit.length){ st.phase="done"; st.done=true; if(totals().done===MODS.length && !state.endAt) state.endAt=Date.now(); }
  }
  resetUi(); saveState(); render();
}

/* ---------- Ringkasan bab ---------- */
function scrSummary(){
  var tt=totals(), end = state.endAt || Date.now();
  var h=topBar("Ringkasan Bab 12");
  h+='<div class="card" style="text-align:center"><div class="muted">Misi Penganalisis Data · T1 Bab 12</div>'+
     '<div class="big">'+esc(state.name)+'</div><div><b>'+esc(state.kelas)+'</b></div>'+
     '<div class="grid2" style="margin-top:10px"><div class="stat">Jumlah markah<br><span class="big">'+tt.t+' / '+tt.mx+'</span><div class="muted">'+(tt.mx?Math.round(tt.t/tt.mx*100):0)+'%</div></div>'+
     '<div class="stat">Masa diambil<br><b>'+fmtTime(end-state.startAt)+'</b><div class="muted">'+(state.endAt?'lengkap':'masih berjalan')+'</div></div></div>'+
     '<div style="margin-top:8px">Misi selesai: <b>'+tt.done+' / '+MODS.length+'</b></div>'+
     '<div class="muted">'+new Date().toLocaleString("ms-MY")+' · 🔖 '+VERSION+'</div></div>';
  h+='<div class="card"><h3>Markah setiap misi</h3>'+table(["SP","Latihan","Tiket","Status"], MODS.map(function(m){ var s=modScore(m.id); return [m.sp, s.bank+"/"+s.bankMax, s.exit+"/"+s.exitMax, state.mods[m.id].done?'<span class="ok-t">✔</span>':'—']; }))+
     '<div class="muted">Markah latihan = soalan betul pada cubaan pertama.</div></div>';
  h+='<div class="card log"><h3>Senarai semua jawapan</h3>';
  if(!state.log.length) h+='<div class="muted">Belum ada jawapan.</div>';
  state.log.forEach(function(r,i){
    h+='<div class="row"><b>'+(i+1)+'.</b> <span class="chip">'+r.m+'</span>'+(r.lvl?'<span class="chip lvl-'+r.lvl+'">'+r.lvl+'</span>':'')+'<span class="muted">'+esc(r.p)+'</span><br>'+esc(r.q)+'<br>Jawapan anda: <b>'+esc(r.a)+'</b> '+(r.ok?'<span class="ok-t">✔ Betul</span>':'<span class="bad-t">✘ Salah</span> · Betul: <b>'+esc(r.c)+'</b>')+'</div>';
  });
  h+='</div><div class="muted" style="text-align:center">Ambil tangkap layar skrin ini dan hantar kepada guru anda.</div>';
  return h;
}

/* ---------- Reset (skrin pengesahan dalaman, bukan confirm()) ---------- */
function scrReset(){
  return topBar("Reset")+'<div class="card" style="background:#fff6dc"><h2>⚠️ Padam semua kemajuan?</h2><p>Nama, markah, masa dan semua jawapan akan dipadam. Tindakan ini tidak boleh dibatalkan.</p>'+
    '<button class="btn danger block" onclick="doReset()">Ya, padam semua</button><button class="btn ghost block" onclick="goBack()">Batal</button></div>';
}
function doReset(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  state=freshState(); MODS.forEach(function(m){ state.mods[m.id]=freshMod(m); });
  resetUi(); saveState(); render();
}

loadState();
render();
</script>
