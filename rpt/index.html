const BLN=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
function tkh(a,z){if(!a)return'';const f=s=>{const d=s.split('-');return (+d[2])+' '+BLN[+d[1]-1]};return f(a)+' – '+f(z)}
